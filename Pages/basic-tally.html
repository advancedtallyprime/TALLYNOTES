<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tally Prime Course Notes</title>

    <!-- Font Awesome 6.5.1 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
      /* CSS Custom Properties */
      :root {
        --bg-main: #f4f8fb;
        --bg-card: #ffffff;
        --bg-card-hover: #eef6fc;
        --text-primary: #1e293b;
        --text-muted: #64748b;
        
        --primary-blue: #0284c7;
        --primary-light: #e0f2fe;
        --primary-hover: #0369a1;
        --border-color: #e2e8f0;
        
        --radius: 8px;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(2, 132, 199, 0.08);
        --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-primary);
        line-height: 1.6;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Header */
      .main-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background-color: var(--bg-card);
        border-bottom: 1px solid var(--border-color);
        padding: 0.85rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: var(--shadow-sm);
        max-width: 1000px;
        width: 100%;
        margin: 0 auto;
      }

      .main-header .nav-link {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9rem;
        transition: var(--transition);
      }

      .main-header .nav-link:hover {
        color: var(--primary-blue);
      }

      .main-header .logo {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--primary-blue);
        text-decoration: none;
        letter-spacing: -0.02em;
      }

      .search-box {
        display: flex;
        align-items: center;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 0.75rem 1rem;
        box-shadow: var(--shadow-sm);
        transition: var(--transition);
        margin-bottom: 0.5rem;
      }

      .search-box:focus-within {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
      }

      .search-box i {
        color: var(--text-muted);
        margin-right: 0.75rem;
      }

      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 0.95rem;
        color: var(--text-primary);
        font-family: inherit;
      }

      /* Layout Container */
      .container {
        max-width: 800px;
        width: 90%;
        margin: 2rem auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      /* Accordion (<details> & <summary>) */
      details {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        overflow: hidden;
        transition: var(--transition);
      }

      details[open] {
        border-color: #bae6fd;
        box-shadow: var(--shadow-md);
      }

      summary {
        padding: 1rem 1.25rem;
        font-weight: 600;
        color: var(--text-primary);
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        user-select: none;
        transition: var(--transition);
      }

      summary::-webkit-details-marker {
        display: none; /* Hide default arrow on Safari/WebKit */
      }

      summary::after {
        content: "+";
        font-size: 1.25rem;
        font-weight: 500;
        color: var(--primary-blue);
        transition: transform 0.2s ease;
      }

      details[open] summary::after {
        content: "−";
      }

      summary:hover {
        background-color: var(--bg-card-hover);
        color: var(--primary-blue);
      }

      details[open] summary {
        border-bottom: 1px solid var(--border-color);
        background-color: #f0f9ff;
        color: var(--primary-hover);
      }

      /* Topics List */
      details ul {
        list-style: none;
        padding: 0.5rem 0;
        background-color: var(--bg-card);
      }

      details li a {
        display: block;
        padding: 0.65rem 1.5rem;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.95rem;
        transition: var(--transition);
      }

      details li a:hover,
      details li a:focus-visible {
        color: var(--primary-blue);
        background-color: var(--bg-card-hover);
        padding-left: 1.85rem;
        outline: none;
      }

      /* Footer */
      .notes-footer {
        background-color: var(--bg-card);
        border-top: 1px solid var(--border-color);
        text-align: center;
        padding: 1.25rem 1rem;
        font-size: 0.875rem;
        color: var(--text-muted);
        margin-top: auto;
      }

      .notes-footer strong {
        color: var(--text-primary);
      }

      /* Mobile Responsiveness */
      @media (max-width: 640px) {
        .container {
          width: 95%;
          margin: 1rem auto;
        }

        summary {
          padding: 0.85rem 1rem;
          font-size: 0.95rem;
        }

        details li a {
          padding: 0.6rem 1.25rem;
        }
      }
    </style>
</head>

<body>

    <header class="main-header">
        <a href="/index.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Home</a>
        <a href="/Pages/basic-tally.html" class="logo">Tally Prime (Basic)</a>
        <a href="/Pages/advanced-tally.html" class="nav-link">Advanced Tally <i class="fa-solid fa-arrow-right"></i></a>
    </header>

    <main class="container">
        <div style="background: #fef3c7; border: 1px solid #fde68a; border-radius: var(--radius); padding: 0.75rem 1rem; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; color: #92400e;">
            <i class="fa-solid fa-graduation-cap" style="font-size: 1.25rem; color: #d97706; flex-shrink: 0;"></i>
            <span><strong>TallyPrime Educational Mode:</strong> All transaction dates are 100% compatible with Free Edu Mode (1st, 2nd, &amp; 31st). &bull; <strong>Dual Language:</strong> All topics support instant switching between <strong>English</strong> and <strong>Hinglish</strong>!</span>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="pageSearch" placeholder="Search topics in Basic Tally..." autocomplete="off">
        </div>

        <div id="courseModules"></div>
    </main>

    <footer class="notes-footer">
        <p>© 2025 GTEC Jain Keerti Education | Notes Prepared by <strong>Anas Sir</strong></p>
    </footer>

    <!-- External course data script -->
    <script src="/TallyPrime/scripts/course-data.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("courseModules");

            // Check if external dataset is available
            if (typeof advancedTallyCourse !== "undefined" && Array.isArray(advancedTallyCourse)) {
                const fragment = document.createDocumentFragment();

                advancedTallyCourse.forEach((module, index) => {
                    const details = document.createElement("details");
                    details.className = "module-block";

                    // Set the FIRST module as open by default
                    if (index === 0) {
                        details.setAttribute("open", "");
                    }

                    const topicsList = module.topics
                        .map(topic => `
                            <li class="topic-row">
                                <a href="/TallyPrime/basic-tally/${module.folder}/${topic}.html">
                                    ${topic.replace(/-/g, " ")}
                                </a>
                            </li>
                        `)
                        .join("");

                    details.innerHTML = `
                        <summary>${module.module}</summary>
                        <ul>${topicsList}</ul>
                    `;

                    fragment.appendChild(details);
                });

                container.appendChild(fragment);

                // Setup live search
                const searchInput = document.getElementById("pageSearch");
                if (searchInput) {
                    searchInput.addEventListener("input", (e) => {
                        const query = e.target.value.toLowerCase().trim();
                        const moduleBlocks = container.querySelectorAll(".module-block");

                        moduleBlocks.forEach(mod => {
                            const topicRows = mod.querySelectorAll(".topic-row");
                            let matches = false;

                            topicRows.forEach(row => {
                                const text = row.textContent.toLowerCase();
                                if (query === "" || text.includes(query)) {
                                    row.style.display = "";
                                    matches = true;
                                } else {
                                    row.style.display = "none";
                                }
                            });

                            if (query !== "") {
                                if (matches) {
                                    mod.style.display = "";
                                    mod.open = true;
                                } else {
                                    mod.style.display = "none";
                                }
                            } else {
                                mod.style.display = "";
                            }
                        });
                    });
                }
            }
        });
    </script>

</body>
</html>
